services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    restart: unless-stopped
    networks:
      - web

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    profiles:
      - tools
    networks:
      - web

  cron:
    image: curlimages/curl:8.17.0
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    command:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -X POST \
            -H "Authorization: Bearer $${CRON_SECRET}" \
            http://app:3000/api/cron/fetch-feeds || true
          sleep 3600
        done
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2.10-alpine
    env_file:
      - ${APP_ENV_FILE:-../.env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
