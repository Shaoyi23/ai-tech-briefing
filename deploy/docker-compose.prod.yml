services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2.10-alpine
    env_file:
      - path: ${APP_ENV_FILE:-../.env.production}
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
