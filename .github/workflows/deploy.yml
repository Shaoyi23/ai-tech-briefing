name: Deploy Techpluse

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Tencent Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/projects/techpluse
            git pull origin main
            docker stop techpluse || true
            docker rm techpluse || true
            docker build -t techpluse .
            docker run -d --name techpluse -p 8082:80 --restart unless-stopped techpluse